apiVersion: apps/v1
kind: Deployment
metadata:
  name: temperature-converter

spec:
  replicas: 1

  selector:
    matchLabels:
      app: temperature-converter

  template:
    metadata:
      labels:
        app: temperature-converter

    spec:
      containers:
        - name: temperature-converter
          image: olenape/temperature-converter:latest

          env:
            - name: DB_HOST
              value: "host.docker.internal"

            - name: DB_PORT
              value: "3306"

            - name: DB_NAME
              value: "temperature_converter"

            - name: DB_USER
              value: "root"

            - name: DB_PASSWORD
              value: "Maria2025"